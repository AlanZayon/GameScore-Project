name: gamescore

# Day to day development runs only the stateful services here and keeps the
# API and web app on the host, which is faster to iterate on and lighter on RAM:
#
#   docker compose up -d          # postgres + redis + mailpit
#   pnpm db:migrate && pnpm db:seed && pnpm dev
#
# The full stack, including the built API and web images, is available with:
#
#   docker compose --profile apps up --build

services:
  postgres:
    image: postgres:18-alpine
    container_name: gamescore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamescore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamescore}
      POSTGRES_DB: ${POSTGRES_DB:-gamescore}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data in a major-version subdirectory, so the
      # mount belongs one level up from the classic /var/lib/postgresql/data.
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gamescore} -d ${POSTGRES_DB:-gamescore}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: gamescore-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Jobs (BullMQ) need the queue to survive a restart, so Redis persists with
    # AOF. Cache and rate-limit keys are still cheap to rebuild if needed.
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: gamescore-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'

  api:
    profiles: ['apps']
    container_name: gamescore-api
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-gamescore}:${POSTGRES_PASSWORD:-gamescore}@postgres:5432/${POSTGRES_DB:-gamescore}?schema=public
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, copy .env.example to .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required, copy .env.example to .env}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-900}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-2592000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RANKING_MINIMUM_REVIEWS: ${RANKING_MINIMUM_REVIEWS:-50}
      SCORE_LABEL_MINIMUM_REVIEWS: ${SCORE_LABEL_MINIMUM_REVIEWS:-10}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-GameScore <noreply@localhost>}
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: ['apps']
    container_name: gamescore-web
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Public values are inlined into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side rendering talks to the API over the compose network.
      API_INTERNAL_URL: http://api:3001
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      - api

volumes:
  postgres-data-v18:
  redis-data:
